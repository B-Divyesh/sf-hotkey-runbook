name: Desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (for example v0.1.8)
        required: true
        default: v0.1.10

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux webview dependencies
        run: sudo apt-get update && sudo apt-get install -y file libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Verify tag names the checked-out release source
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p \"require('./package.json').version\")" = "$GITHUB_REF_NAME" && test -n "$(git rev-parse HEAD)"
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run lint
      - run: npm run test:e2e
      - run: npm run build

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macos-x86_64
            platform: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - name: windows-x86_64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - name: linux-x86_64
            platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - id: source
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - name: Linux webview dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y file libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Verify the Windows installer checksum gate
        if: matrix.name == 'windows-x86_64'
        run: npm run test:unit -- --testNamePattern @claim:installer-ps1-checksum
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOTKEY_BUILD_COMMIT: ${{ steps.source.outputs.commit }}
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Verify packaged installed-build identity
        if: matrix.name == 'linux-x86_64'
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          appimage=$(find src-tauri/target/${{ matrix.target }}/release/bundle -name '*.AppImage' -print -quit)
          test -n "$appimage"
          expected_version=$(node -p "require('./package.json').version")
          work=$(mktemp -d)
          cp "$appimage" "$work/app.AppImage"
          chmod +x "$work/app.AppImage"
          (
            cd "$work"
            ./app.AppImage --appimage-extract >/dev/null
            identity=$(./squashfs-root/AppRun --build-identity)
            test "$identity" = "{\"version\":\"$expected_version\",\"commit\":\"$EXPECTED_COMMIT\"}"
          )
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Build checksums and download manifest
        run: |
          test "v$(node -p \"require('./package.json').version\")" = "$RELEASE_VERSION"
          RELEASE_COMMIT=$(git rev-parse HEAD)
          echo "RELEASE_COMMIT=$RELEASE_COMMIT" >> "$GITHUB_ENV"
          RELEASE_COMMIT="$RELEASE_COMMIT" node scripts/release-manifest.mjs artifacts release-assets
      - name: Validate manifest and checksums
        run: |
          node -e "const m=JSON.parse(require('fs').readFileSync('release-assets/latest.json')); if (m.version !== process.env.RELEASE_VERSION || m.commit !== process.env.RELEASE_COMMIT) throw new Error('release metadata does not identify this tag commit');"
          node scripts/verify-release-identity.mjs release-assets "$RELEASE_COMMIT"
          (cd release-assets && sha256sum -c SHA256SUMS)
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ env.RELEASE_COMMIT }}
          name: Hotkey Runbook ${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          prerelease: false
          files: release-assets/*
