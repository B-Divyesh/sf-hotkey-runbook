name: Desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (for example v0.1.4)
        required: true
        default: v0.1.4

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux webview dependencies
        run: sudo apt-get update && sudo apt-get install -y file libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run lint
      - run: npm run test:e2e
      - run: npm run build

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macos-x86_64
            platform: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - name: windows-x86_64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - name: linux-x86_64
            platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - name: Linux webview dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y file libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Verify the Windows installer checksum gate
        if: matrix.name == 'windows-x86_64'
        run: npm run test:unit -- --testNamePattern @claim:installer-ps1-checksum
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Build checksums and download manifest
        run: node scripts/release-manifest.mjs artifacts release-assets
      - name: Validate manifest and checksums
        run: node -e "JSON.parse(require('fs').readFileSync('release-assets/latest.json'));" && (cd release-assets && sha256sum -c SHA256SUMS)
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: Hotkey Runbook ${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          prerelease: false
          files: release-assets/*
