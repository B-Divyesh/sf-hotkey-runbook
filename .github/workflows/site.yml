name: Static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Refresh release manifest
        run: curl -fsSL https://github.com/B-Divyesh/sf-hotkey-runbook/releases/latest/download/latest.json -o public/latest.json || test -f public/latest.json
      - run: npm run build:site
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/site
