[package]
name = "hotkey-runbook"
version = "0.1.0"
description = "A local, reviewable runbook launcher"
authors = ["Param Factory"]
license = "MIT"
edition = "2021"

[lib]
name = "hotkey_runbook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
hex = "0.4"
regex = "1"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
thiserror = "2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
